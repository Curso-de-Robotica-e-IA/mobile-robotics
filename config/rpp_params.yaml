# =============================================================================
# RPP — Regulated Pure Pursuit Controller
# Controller alternativo ao DWB, padrão a partir do ROS 2 Iron.
#
# O RPP usa o algoritmo Pure Pursuit: calcula um ponto à frente no caminho
# (lookahead point) e gera comandos de velocidade para atingi-lo.
# É geometricamente mais simples que o DWB, produz trajetórias mais suaves
# e oscila menos em trechos retos — características favoráveis para coleta
# de dados wireless reproduzível.
#
# Referência: https://navigation.ros.org/configuration/packages/configuring-regulated-pp.html
# =============================================================================

controller_server:
  ros__parameters:
    use_sim_time: False                  # False para robô real
    controller_frequency: 20.0          # Hz — frequência de publicação de cmd_vel
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # -------------------------------------------------------------------------
    # Progress Checker — igual ao DWB para comparação justa
    # -------------------------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # -------------------------------------------------------------------------
    # Goal Checker — tolerâncias idênticas ao DWB para comparação justa
    # -------------------------------------------------------------------------
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25          # Mesmo valor do DWB — comparação justa
      yaw_goal_tolerance: 0.25         # Mesmo valor do DWB — comparação justa

    # -------------------------------------------------------------------------
    # RPP — Regulated Pure Pursuit
    # -------------------------------------------------------------------------
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Velocidade desejada ---
      # Velocidade linear nominal durante a navegação em linha reta.
      # Igual ao max_vel_x do DWB para comparação justa de tempo de missão.
      desired_linear_vel: 0.26          # m/s — igual ao max_vel_x do DWB

      # --- Lookahead (ponto à frente no caminho) ---
      # O RPP calcula um ponto à frente no caminho planejado e navega em
      # direção a ele. A distância de lookahead controla o "quanto à frente"
      # o robô olha.
      # Lookahead maior = curvas mais suaves mas pode cortar cantos.
      # Lookahead menor = segue o caminho mais fielmente mas pode oscilar.
      lookahead_dist: 0.6               # m — distância de lookahead nominal
      min_lookahead_dist: 0.3           # m — limite mínimo do lookahead adaptativo
      max_lookahead_dist: 0.9           # m — limite máximo do lookahead adaptativo
      lookahead_time: 1.5               # s — tempo à frente para calcular lookahead adaptativo

      # --- Regulação de velocidade linear ---
      # O RPP pode reduzir a velocidade automaticamente em curvas e próximo
      # a obstáculos — daí o nome "Regulated" Pure Pursuit.
      use_regulated_linear_velocity_scaling: True   # Reduz vel. em curvas fechadas
      use_fixed_curvature_lookahead: False           # Usa lookahead adaptativo (não fixo)
      curvature_lookahead_dist: 0.25    # m — distância usada para estimar curvatura local

      # --- Regulação por obstáculos ---
      # Reduz velocidade quando há obstáculos próximos no costmap.
      use_cost_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.9      # m — raio mínimo de curvatura antes de desacelerar
      regulated_linear_scaling_min_speed: 0.25      # m/s — velocidade mínima após regulação

      # --- Detecção de colisão ---
      # Verifica colisões ao longo do caminho à frente antes de executar.
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0  # s — tempo máximo projetado sem colisão

      # --- Comportamento no goal ---
      # Permite que o robô gire no lugar para alinhar com a orientação do goal
      # após chegar na posição.
      use_rotate_to_heading: True
      rotate_to_heading_min_angle: 0.785  # rad (~45°) — ângulo mínimo para acionar rotação
      rotate_to_heading_angular_vel: 1.8  # rad/s — velocidade da rotação final
      max_angular_accel: 3.2              # rad/s² — aceleração angular máxima (igual ao DWB)

      # --- Interpolação do caminho ---
      # Interpola pontos extras no caminho planejado para melhor suavidade.
      use_interpolation: True

      # --- Tolerâncias ---
      transform_tolerance: 0.2