# =============================================================================
# DWB Controller (Dynamic Window Approach)
# Controller padrão do TurtleBot 4 + ROS 2 Humble
#
# O DWB amostra um espaço de velocidades possíveis (janela dinâmica),
# simula trajetórias candidatas e escolhe a melhor de acordo com um
# conjunto de critics (funções de custo). É reativo e lida bem com
# obstáculos, mas pode oscilar lateralmente em trechos retos.
#
# Referência: https://navigation.ros.org/configuration/packages/configuring-dwb-controller.html
# =============================================================================

controller_server:
  ros__parameters:
    use_sim_time: False                  # False para robô real
    controller_frequency: 20.0          # Hz — frequência de publicação de cmd_vel
    min_x_velocity_threshold: 0.001     # Velocidade mínima em X para considerar o robô em movimento
    min_y_velocity_threshold: 0.5       # Não relevante para diferencial (sem movimento lateral)
    min_theta_velocity_threshold: 0.001 # Velocidade angular mínima para considerar rotação
    failure_tolerance: 0.3              # Segundos tolerados de falha antes de recovery

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # -------------------------------------------------------------------------
    # Progress Checker
    # Verifica se o robô está de fato avançando durante a navegação.
    # Se ficar parado por tempo demais sem mover o suficiente, aciona recovery.
    # -------------------------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5    # Mínimo de deslocamento (m) para considerar progresso
      movement_time_allowance: 10.0    # Tempo máximo (s) sem progresso antes de falhar

    # -------------------------------------------------------------------------
    # Goal Checker
    # Define quando o robô considerou o goal atingido.
    # IMPORTANTE para o experimento: tolerâncias menores = robô chega mais
    # perto do goal exato, mas pode demorar mais ou oscilar para convergir.
    # -------------------------------------------------------------------------
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25          # Tolerância de posição (m) — padrão TurtleBot 4
      yaw_goal_tolerance: 0.25         # Tolerância angular (rad) — padrão TurtleBot 4

    # -------------------------------------------------------------------------
    # DWB Local Planner
    # -------------------------------------------------------------------------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True   # Publica detalhes das trajetórias avaliadas (útil para debug)

      # --- Limites de velocidade linear ---
      # Definem a janela dinâmica de velocidades amostradas.
      # max_vel_x é a velocidade máxima do TurtleBot 4 (limitação física).
      min_vel_x: 0.0                   # O robô não anda para trás neste cenário
      min_vel_y: 0.0                   # Diferencial: sem movimento lateral
      max_vel_x: 0.26                  # m/s — limite físico do TurtleBot 4
      max_vel_y: 0.0                   # Diferencial: sempre 0
      max_vel_theta: 1.0               # rad/s — velocidade angular máxima
      min_speed_xy: 0.0                # Velocidade linear mínima do conjunto XY
      max_speed_xy: 0.26               # Velocidade linear máxima do conjunto XY
      min_speed_theta: 0.0             # Velocidade angular mínima

      # --- Limites de aceleração ---
      # Controlam quão abruptamente o robô acelera/desacelera.
      # Valores altos = resposta rápida mas movimentos bruscos.
      # Valores baixos = movimentos mais suaves mas resposta mais lenta.
      acc_lim_x: 2.5                   # m/s² — aceleração linear máxima
      acc_lim_y: 0.0                   # Diferencial: sempre 0
      acc_lim_theta: 3.2               # rad/s² — aceleração angular máxima
      decel_lim_x: -2.5                # m/s² — desaceleração linear máxima
      decel_lim_y: 0.0
      decel_lim_theta: -3.2            # rad/s² — desaceleração angular máxima

      # --- Amostragem da janela dinâmica ---
      # Quantas velocidades são amostradas em cada dimensão.
      # Mais amostras = melhor cobertura do espaço mas maior custo computacional.
      vx_samples: 20                   # Amostras de velocidade linear em X
      vy_samples: 5                    # Amostras em Y (irrelevante para diferencial)
      vtheta_samples: 20               # Amostras de velocidade angular

      # --- Simulação de trajetórias ---
      sim_time: 1.7                    # Segundos à frente para simular cada trajetória candidata
      linear_granularity: 0.05         # Resolução (m) da simulação linear
      angular_granularity: 0.025       # Resolução (rad) da simulação angular

      # --- Tolerâncias ---
      transform_tolerance: 0.2         # Segundos de tolerância para transformadas TF
      xy_goal_tolerance: 0.25          # Redundante com goal_checker mas mantido por compatibilidade
      trans_stopped_velocity: 0.25     # Velocidade abaixo da qual o robô é considerado parado
      short_circuit_trajectory_evaluation: True  # Para avaliação assim que achar trajetória boa
      stateful: True

      # --- Critics (funções de custo) ---
      # Cada critic pontua as trajetórias candidatas. A trajetória com menor
      # custo total é executada. A escala (scale) define o peso de cada critic.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      # Penaliza obstáculos próximos. Scale baixo = menos aversão a obstáculos.
      BaseObstacle.scale: 0.02

      # Alinha o robô com o caminho planejado (olhando à frente).
      # Scale alto = robô tende a ficar bem alinhado ao path.
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1

      # Alinha o robô com a direção do goal.
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1

      # Minimiza distância ao caminho planejado — principal critic para seguir o path.
      # Scale alto = robô tende a se manter próximo ao caminho global.
      PathDist.scale: 32.0

      # Minimiza distância ao goal.
      GoalDist.scale: 24.0

      # Força rotação para alinhar com o goal antes de avançar.
      # slowing_factor: desacelera enquanto gira. lookahead_time: -1 = sem lookahead.
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0